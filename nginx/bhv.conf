worker_processes 1;
error_log __PROJECT_DIR__/nginx/logs/error.log warn;
pid       __PROJECT_DIR__/nginx/nginx.pid;

events { worker_connections 64; }

http {
    include      __NGINX_ETC__/mime.types;
    default_type application/octet-stream;
    access_log   __PROJECT_DIR__/nginx/logs/access.log combined;
    sendfile on;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        root __PROJECT_DIR__/frontend/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}
